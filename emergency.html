<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeMed Emergency Card</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{max-width:420px;width:100%;background:#1e293b;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.header{background:linear-gradient(135deg,#dc2626,#b91c1c);padding:20px;text-align:center}
.header h1{font-size:1.3rem;color:white;letter-spacing:1px}
.header .subtitle{color:#fecaca;font-size:.8rem;margin-top:4px}
.patient{padding:20px;background:#1e293b;border-bottom:1px solid #334155}
.patient-name{font-size:1.4rem;font-weight:700;color:#f8fafc}
.patient-meta{color:#94a3b8;font-size:.9rem;margin-top:4px}
.patient-meta span{margin-right:12px}
.blood{display:inline-block;background:#dc2626;color:white;font-weight:700;padding:2px 10px;border-radius:6px;font-size:.85rem}
.section{padding:16px 20px;border-bottom:1px solid #334155}
.section-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;color:#64748b;font-weight:600;margin-bottom:8px}
.allergy-tag{display:inline-block;background:#7f1d1d;color:#fca5a5;padding:4px 12px;border-radius:20px;font-weight:600;font-size:.9rem;margin:2px 4px 2px 0}
.condition-tag{display:inline-block;background:#1e3a5f;color:#7dd3fc;padding:4px 12px;border-radius:20px;font-size:.85rem;margin:2px 4px 2px 0}
.med-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #293548}
.med-item:last-child{border:none}
.med-name{font-size:.9rem;color:#e2e8f0}
.med-dose{font-size:.8rem;color:#94a3b8}
.warning{background:#451a03;border-left:3px solid #f97316;padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:8px;font-size:.85rem;color:#fed7aa}
.warning:last-child{margin-bottom:0}
.warning-high{border-left-color:#ef4444;background:#450a0a;color:#fca5a5}
.footer{padding:12px 20px;text-align:center;color:#475569;font-size:.75rem}
.no-data{text-align:center;padding:60px 20px;color:#94a3b8}
.no-data h2{color:#38bdf8;margin-bottom:8px}
</style>
</head>
<body>
<div class="card" id="card">
<div class="no-data" id="nodata">
<h2>SafeMed Emergency Card</h2>
<p>No patient data in URL</p>
</div>
</div>
<script>
try {
  const hash = location.hash.slice(1);
  if (!hash) throw "no data";
  const data = JSON.parse(decodeURIComponent(atob(hash)));
  const card = document.getElementById("card");
  const p = data.p || {};
  const allergies = data.a || [];
  const conditions = data.c || [];
  const meds = data.m || [];
  const warnings = data.w || [];
  let html = '<div class="header"><h1>SAFEMED EMERGENCY CARD</h1><div class="subtitle">Scan verified \u00b7 '+(data.d||"")+'</div></div><div class="patient"><div class="patient-name">'+(p.n||"Unknown")+'</div><div class="patient-meta"><span>Age: '+(p.a||"?")+'</span><span>'+(p.g||"")+'</span>'+(p.b?'<span class="blood">'+p.b+'</span>':"")+'</div></div>';
  if(allergies.length){html+='<div class="section"><div class="section-label">Allergies</div>'+allergies.map(a=>'<span class="allergy-tag">'+a+'</span>').join("")+'</div>';}
  if(conditions.length){html+='<div class="section"><div class="section-label">Conditions</div>'+conditions.map(c=>'<span class="condition-tag">'+c+'</span>').join("")+'</div>';}
  if(meds.length){html+='<div class="section"><div class="section-label">Active Medicines</div>'+meds.map(m=>'<div class="med-item"><span class="med-name">'+m.n+'</span><span class="med-dose">'+m.d+'</span></div>').join("")+'</div>';}
  if(warnings.length){html+='<div class="section"><div class="section-label">Warnings</div>'+warnings.map(w=>'<div class="warning warning-high">'+w+'</div>').join("")+'</div>';}
  html+='<div class="footer">Generated by SafeMed \u00b7 For emergency use \u00b7 Verify with prescribing doctor</div>';
  card.innerHTML=html;
}catch(e){}
</script>
</body>
</html>
